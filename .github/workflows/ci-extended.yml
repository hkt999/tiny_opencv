name: Extended CI

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

concurrency:
  group: extended-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ pkg-config libopencv-dev

      - name: Build and Run Examples
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
          cmake --build build -j
          mkdir -p /tmp/tiny_opencv_examples_bin
          for f in examples/*.cpp; do
            name=$(basename "$f" .cpp)
            g++ -std=c++11 -Iinclude "$f" build/libtiny_opencv.a -o "/tmp/tiny_opencv_examples_bin/$name"
            "/tmp/tiny_opencv_examples_bin/$name"
          done

      - name: Coverage Gate
        run: |
          ./scripts/coverage_gate.sh | tee coverage_gate.log

      - name: Coverage Summary
        run: |
          echo "## Coverage Gate" >> "$GITHUB_STEP_SUMMARY"
          grep '^\[coverage\]' coverage_gate.log >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Coverage Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-gate-log
          path: coverage_gate.log

  sanitizer:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        san: [address, undefined]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ pkg-config libopencv-dev

      - name: Build (${{ matrix.san }})
        run: |
          if [ "${{ matrix.san }}" = "address" ]; then
            SAN_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          else
            SAN_FLAGS="-fsanitize=undefined -fno-sanitize-recover=all -fno-omit-frame-pointer"
          fi
          cmake -S . -B build_san \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_FLAGS="$SAN_FLAGS" \
            -DCMAKE_CXX_FLAGS="$SAN_FLAGS" \
            -DCMAKE_EXE_LINKER_FLAGS="$SAN_FLAGS"
          cmake --build build_san -j

      - name: Run Unit Tests (${{ matrix.san }})
        run: |
          ./build_san/tiny_opencv_test | tee "sanitizer_${{ matrix.san }}.log"

      - name: Upload Sanitizer Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sanitizer-${{ matrix.san }}-log
          path: sanitizer_${{ matrix.san }}.log
