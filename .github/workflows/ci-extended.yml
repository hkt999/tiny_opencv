name: Extended CI

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

concurrency:
  group: extended-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ pkg-config libopencv-dev

      - name: Coverage Gate
        run: |
          set -o pipefail
          ./scripts/coverage_gate.sh 2>&1 | tee coverage_gate.log

      - name: Coverage Summary
        run: |
          echo "## Coverage Gate" >> "$GITHUB_STEP_SUMMARY"
          grep '^\[coverage\]' coverage_gate.log >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Coverage Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-gate-log
          path: coverage_gate.log
          if-no-files-found: ignore

  sanitizer:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        san: [address, undefined]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ clang pkg-config libopencv-dev

      - name: Build (${{ matrix.san }})
        run: |
          set -o pipefail
          if [ "${{ matrix.san }}" = "address" ]; then
            SAN_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          else
            SAN_FLAGS="-fsanitize=undefined -fno-sanitize-recover=all -fno-omit-frame-pointer"
          fi
          cmake -S . -B build_san \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_FLAGS="$SAN_FLAGS" \
            -DCMAKE_CXX_FLAGS="$SAN_FLAGS" \
            -DCMAKE_EXE_LINKER_FLAGS="$SAN_FLAGS" 2>&1 | tee "sanitizer_${{ matrix.san }}_build.log"
          cmake --build build_san -j 2>&1 | tee -a "sanitizer_${{ matrix.san }}_build.log"

      - name: Run Unit Tests (${{ matrix.san }})
        run: |
          set -o pipefail
          ./build_san/tiny_opencv_test 2>&1 | tee "sanitizer_${{ matrix.san }}.log"

      - name: Upload Sanitizer Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sanitizer-${{ matrix.san }}-log
          path: |
            sanitizer_${{ matrix.san }}.log
            sanitizer_${{ matrix.san }}_build.log
          if-no-files-found: ignore
